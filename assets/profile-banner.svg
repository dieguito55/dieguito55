<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Juan Diego Canaza Paucara — Ingeniería de software e inteligencia artificial</title>
<desc id="desc">Ingeniero de Sistemas. Full-stack, backend e IA aplicada. Puno, Perú.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101426"/><stop offset="1" stop-color="#17132c"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c4b5fd" stroke-opacity=".05"/></pattern>
<style>
.orbit{transform-origin:1030px 180px;animation:spin 36s linear infinite}.signal{animation:pulse 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.orbit,.signal{animation:none}}
</style>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<circle cx="1040" cy="180" r="310" fill="url(#glow)"/>
<rect x="48" y="49" width="4" height="24" rx="2" fill="url(#accent)"/>
<text x="67" y="67" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="3">SOFTWARE ENGINEERING · BACKEND · APPLIED AI</text>
<text x="48" y="139" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="700" letter-spacing="-1.5">Juan Diego</text>
<text x="48" y="196" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="700" letter-spacing="-1.5">Canaza Paucara</text>
<text x="50" y="237" fill="#b8c3d9" font-family="Arial,Helvetica,sans-serif" font-size="19">Sistemas empresariales. Backend. Inteligencia artificial.</text>
<rect x="49" y="272" width="390" height="35" rx="17.5" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".11"/>
<text x="66" y="294" fill="#ddd6fe" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600">FULL-STACK</text>
<circle cx="172" cy="289" r="2" fill="#64748b"/>
<text x="187" y="294" fill="#ddd6fe" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600">BACKEND</text>
<circle cx="271" cy="289" r="2" fill="#64748b"/>
<text x="286" y="294" fill="#5eead4" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600">IA APLICADA</text>
<text x="49" y="337" fill="#7e8ba5" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.5">INGENIERO DE SISTEMAS / PUNO, PERÚ</text>
<g fill="none">
<circle cx="1030" cy="180" r="132" stroke="#a78bfa" stroke-opacity=".15"/>
<circle cx="1030" cy="180" r="96" stroke="#a78bfa" stroke-opacity=".2"/>
<circle cx="1030" cy="180" r="60" stroke="#5eead4" stroke-opacity=".2"/>
<g class="orbit"><circle cx="1030" cy="180" r="132" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="68 762"/><circle cx="1030" cy="48" r="4" fill="#c4b5fd"/></g>
<path d="M898 180h264M1030 48v264" stroke="#a78bfa" stroke-opacity=".1"/>
</g>
<rect x="982" y="132" width="96" height="96" rx="26" fill="#17182d" stroke="#a78bfa" stroke-opacity=".4"/>
<text x="1030" y="193" text-anchor="middle" fill="#eee9ff" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700">JD</text>
<circle class="signal" cx="1090" cy="273" r="5" fill="#5eead4"/>
<text x="1030" y="342" text-anchor="middle" fill="#7e8ba5" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="3">BUILD WITH PURPOSE</text>
</svg>
